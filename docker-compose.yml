services:
  db:
    image: postgres:16-alpine
    container_name: snip_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snip}
      POSTGRES_DB: ${POSTGRES_DB:-snip}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snip} -d ${POSTGRES_DB:-snip}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snip_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations, then exits
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-snip}:${POSTGRES_PASSWORD:-snip}@db:5432/${POSTGRES_DB:-snip}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-snip}:${POSTGRES_PASSWORD:-snip}@db:5432/${POSTGRES_DB:-snip}
      REDIS_URL: redis://redis:6379
      # A demo value for local runs: set your own IP_HASH_SECRET in .env
      IP_HASH_SECRET: ${IP_HASH_SECRET:-local-demo-secret-change-me}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
