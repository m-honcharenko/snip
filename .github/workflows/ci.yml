name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://snip:snip@localhost:5432/snip
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snip
          POSTGRES_PASSWORD: snip
          POSTGRES_DB: snip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snip -d snip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@26
          cache: true
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build the images and start the stack
        run: docker compose up -d --build
      - name: Wait for the app
        run: curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3000/health
      - name: Create a link and follow it
        run: |
          code=$(curl -fsS -X POST http://localhost:3000/links \
            -H 'content-type: application/json' \
            -d '{"url":"https://example.com"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['code'])")
          status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/$code")
          echo "redirect status: $status"
          test "$status" = "302"
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
